---
# tasks file for roles/netplan

# ------------------------------------------------------------------------------
- name: "NETPLAN | apt | install apt services"
  become: true
  ansible.builtin.apt:
    pkg: netplan.io
    state: present
    force_apt_get: true # apt-get instead of aptitude
    update_cache: true
  when:
    - netplan_install is defined
    - netplan_install | bool
  tags:
    - netplan

# ------------------------------------------------------------------------------
- name: "NETPLAN | find existing netplan files to remove"
  become: true
  ansible.builtin.find:
    paths: "{{ netplan_dir }}"
    patterns: "*.yml,*yaml"
    excludes: "{{ netplan_file }}"
  register: files_to_delete
  when: netplan_remove_existing | bool
  tags:
    - netplan

- name: "NETPLAN | remove found netplan files"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ files_to_delete.files | flatten(levels=1) }}"
  when:
    - files_to_delete.files is defined
    - netplan_remove_existing | bool
  tags:
    - netplan

- name: "NETPLAN | copy netplan template into netplan directory"
  become: true
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: "{{ netplan_dir }}/{{ netplan_file }}"
    owner: root
    group: root
    mode: "0600"
  register: netplan_changed_template
  when:
    - netplan_configuration is defined
    - netplan_configuration != []
  notify: Netplan generate config
  tags:
    - netplan

# ------------------------------------------------------------------------------
- name: "NETPLAN | disable and stop systemd-resolved"
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  when:
    - netplan_renderer != 'networkd'
  tags:
    - netplan
