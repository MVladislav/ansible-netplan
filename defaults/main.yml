---
# defaults file for roles/netplan

netplan_install: false
netplan_remove_existing: false
netplan_service_name: default

# NetworkManager | networkd
netplan_renderer: networkd
netplan_version: 2

netplan_dir: /etc/netplan
netplan_file: "00-{{ netplan_service_name }}.yaml"

# Default interface used by the basic configuration below.
netplan_default_iface: >-
  {{ (ansible_facts | default({})).get('default_ipv4', {}).get('interface')
     or (ansible_facts | default({})).get('default_ipv6', {}).get('interface')
     or 'eth0' }}

# Basic default: configure the default interface with DHCP for IPv4 and IPv6.
netplan_configuration:
  network:
    ethernets: "{{ {netplan_default_iface: {'dhcp4': true, 'dhcp6': true}} }}"

# EXAMPLES:
#
# 1) Normal server example (DHCP on the network, networkd):
#
# netplan_remove_existing: false
# netplan_renderer: networkd
# netplan_default_iface: >-
#   {{ (ansible_facts | default({})).get('default_ipv4', {}).get('interface')
#      or (ansible_facts | default({})).get('default_ipv6', {}).get('interface')
#      or 'eth0' }}
# netplan_default_mac: >-
#   {{ (ansible_facts | default({})).get('default_ipv4', {}).get('macaddress')
#      or (ansible_facts | default({})).get('default_ipv6', {}).get('macaddress')
#      or '' }}
# netplan_iface_cfg_server:
#   dhcp4: true
#   dhcp6: true
#   match:
#     macaddress: "{{ netplan_default_mac }}"
#   set-name: "{{ netplan_default_iface }}"
#   # Optional: nameservers, extra addresses, static routes, etc.
# netplan_configuration:
#   network:
#     ethernets: "{{ {netplan_default_iface: netplan_iface_cfg_server} }}"
#
# 2) Hetzner-style server example (provider-specific IPv6 routed via link-local gateway):
#
# netplan_remove_existing: false
# netplan_renderer: networkd
# netplan_default_iface: >-
#   {{ (ansible_facts | default({})).get('default_ipv4', {}).get('interface')
#      or (ansible_facts | default({})).get('default_ipv6', {}).get('interface')
#      or 'eth0' }}
# netplan_default_mac: >-
#   {{ (ansible_facts | default({})).get('default_ipv4', {}).get('macaddress')
#      or (ansible_facts | default({})).get('default_ipv6', {}).get('macaddress')
#      or '' }}
# netplan_iface_cfg_server:
#   dhcp4: true
#   dhcp6: false
#   match:
#     macaddress: "{{ netplan_default_mac }}"
#   set-name: "{{ netplan_default_iface }}"
#   addresses:
#     - "<YOUR_IPV6_ADDRESS_OR_PREFIX>/64" # replace with provider-assigned value
#   routes:
#     - on-link: true
#       to: default
#       via: "fe80::1"
#   nameservers:
#     addresses:
#       - 2a01:4ff:ff00::add:1
#       - 2a01:4ff:ff00::add:2
# netplan_configuration:
#   network:
#     ethernets: "{{ {netplan_default_iface: netplan_iface_cfg_server} }}"
#
# 3) Client example (NetworkManager, deterministic UUID, custom netplan filename):
#
# netplan_remove_existing: false
# netplan_renderer: NetworkManager
# netplan_default_iface: >-
#   {{ (ansible_facts | default({})).get('default_ipv4', {}).get('interface')
#      or (ansible_facts | default({})).get('default_ipv6', {}).get('interface')
#      or 'eth0' }}
# netplan_default_mac: >-
#   {{ (ansible_facts | default({})).get('default_ipv4', {}).get('macaddress')
#      or (ansible_facts | default({})).get('default_ipv6', {}).get('macaddress')
#      or '' }}
# netplan_nm_uuid: "{{ (inventory_hostname ~ '-' ~ netplan_default_iface) | to_uuid }}"
# netplan_service_name: "nm-{{ netplan_default_iface }}"
# netplan_file: "90-{{ netplan_service_name }}.yaml"
# netplan_iface_cfg_client:
#   renderer: NetworkManager
#   dhcp4: true
#   dhcp6: true
#   match:
#     macaddress: "{{ netplan_default_mac }}"
#   set-name: "{{ netplan_default_iface }}"
#   networkmanager:
#     uuid: "{{ netplan_nm_uuid }}"
#     name: "{{ netplan_default_iface }}"
#     # Optional NetworkManager passthrough settings:
#     # passthrough:
#     #   ipv6.ip6-privacy: "-1"
# netplan_configuration:
#   network:
#     ethernets: "{{ {netplan_default_iface: netplan_iface_cfg_client} }}"
#
# 4) Dynamic IPv4 address/prefix and default route from target facts (routes-based):
#
# netplan_configuration:
#   network:
#     ethernets: >-
#       {{ {
#         netplan_default_iface: {
#           'dhcp4': false,
#           'dhcp6': false,
#           'addresses': [
#             (ansible_facts | default({})).get('default_ipv4', {}).get('address')
#             ~ '/' ~ ((ansible_facts | default({})).get('default_ipv4', {}).get('prefix', 24) | string)
#           ],
#           'routes': [
#             {'to': 'default', 'via': (ansible_facts | default({})).get('default_ipv4', {}).get('gateway')}
#           ],
#           'nameservers': {'addresses': ['1.1.1.1', '1.0.0.1']}
#         }
#       } }}
#
# 5) Dynamic IPv6 address/prefix and default route from target facts (routes-based):
#
# netplan_configuration:
#   network:
#     ethernets: >-
#       {{ {
#         netplan_default_iface: {
#           'dhcp4': false,
#           'dhcp6': false,
#           'addresses': [
#             (ansible_facts | default({})).get('default_ipv6', {}).get('address')
#             ~ '/' ~ ((ansible_facts | default({})).get('default_ipv6', {}).get('prefix', 64) | string)
#           ],
#           'routes': [
#             {'to': 'default', 'via': (ansible_facts | default({})).get('default_ipv6', {}).get('gateway')}
#           ],
#           'nameservers': {'addresses': ['2606:4700:4700::1111', '2606:4700:4700::1001']}
#         }
#       } }}
#
# Notes:
# - Prefer `routes` with `to: default` instead of legacy `gateway4`/`gateway6`.
# - For NetworkManager renderer (!= networkd), this role stops/disables systemd-resolved.
# - Set netplan_remove_existing: true only if you intentionally want to remove other netplan files.
# - For other netplan sections (wifis, bonds, bridges, vlans), define them under
#   netplan_configuration.network. The template renders version/renderer from
#   netplan_version/netplan_renderer.
